const $=s=>document.querySelector(s),mk=(t,cl,h)=>{const e=document.createElement(t);e.className=cl||'';if(h)e.innerHTML=h;return e};
const W=720,H=860,D=Math.min(2,Math.max(1,devicePixelRatio||1)),INK='#1c1c1c',TT='บัตเตอร์เบียร์เสี่ยบรม';

let st=0,gi=0,ci=0,L=0,pour=0,down=0,dirty=1,K=1,bs=28,sel=0,mp=null,sp=null,tgt=null,drag=-1,strokes=[],stk=[],DL=null,mute=0,T=0,BT=0,spd=0;

const G=[
{t:330,b:710,gy:712,h:[285,380,640],p:x=>{x.moveTo(255,330);x.lineTo(255,690);x.quadraticCurveTo(255,712,277,712);x.lineTo(433,712);x.quadraticCurveTo(455,712,455,690);x.lineTo(455,330);x.closePath()},
 e:x=>{x.moveTo(455,380);x.bezierCurveTo(550,370,550,650,455,645);x.moveTo(455,412);x.bezierCurveTo(515,405,515,615,455,612)}},
{t:300,b:718,gy:720,h:[300,350,640],p:x=>{x.moveTo(245,300);x.lineTo(295,700);x.quadraticCurveTo(297,720,317,720);x.lineTo(403,720);x.quadraticCurveTo(423,720,425,700);x.lineTo(475,300);x.closePath()},e:()=>{}},
{t:320,b:595,gy:722,h:[268,360,470],p:x=>{x.moveTo(230,320);x.bezierCurveTo(230,500,290,590,360,596);x.bezierCurveTo(430,590,490,500,490,320);x.closePath()},
 e:x=>{x.moveTo(352,596);x.lineTo(349,700);x.moveTo(368,596);x.lineTo(371,700);x.moveTo(430,708);x.ellipse(360,708,70,14,0,0,6.3)}}];

// grain
const gc=document.createElement('canvas');gc.width=gc.height=200;const gx=gc.getContext('2d'),id=gx.createImageData(200,200);
for(let i=0;i<id.data.length;i+=4){id.data[i]=id.data[i+1]=id.data[i+2]=255;id.data[i+3]=Math.random()<.34?60+Math.random()*150:0}gx.putImageData(id,0,0);const GP=c.createPattern(gc,'repeat');

const J=[[0,0,1],[1.3,-.8,.45],[-1,1.1,.3]];
function ink(x,f,w=3,col=INK){x.strokeStyle=col;x.lineCap=x.lineJoin='round';J.forEach(([a,b,o],i)=>{x.save();x.translate(a*K,b*K);x.globalAlpha=o;x.lineWidth=w*K*(i?.55:1);if(f instanceof Path2D)x.stroke(f);else{x.beginPath();f(x);x.stroke()}x.restore()})}
function glass(x,g,l,col){
 if(l>0){x.save();x.beginPath();g.p(x);x.clip();const y=g.b-(g.b-g.t-34)*l;
  x.globalAlpha=.93;x.fillStyle=col;x.fillRect(200,y,400,520);x.globalAlpha=1;
  x.strokeStyle='rgba(0,0,0,.13)';x.lineWidth=1.3;x.beginPath();for(let i=-120;i<420;i+=14){x.moveTo(200+i,y);x.lineTo(310+i,y+400)}x.stroke();
  x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=1.8;x.beginPath();
  for(let i=0;i<9;i++){const r=2+i%3,bx=275+(i*43)%170+Math.sin(T*2+i)*4,by=g.b-6-((BT+i*67)%Math.max(40,g.b-y-10));x.moveTo(bx+r,by);x.arc(bx,by,r,0,6.3)}x.stroke();
  x.strokeStyle='rgba(0,0,0,.55)';x.lineWidth=2;x.beginPath();for(let i=200;i<=520;i+=10)x.lineTo(i,y+Math.sin(i/22+T*(pour?8:0))*(pour?2.5:1.2));x.stroke();x.restore()}
 ink(x,v=>{v.moveTo(g.h[0],g.h[1]);v.lineTo(g.h[0]-1,g.h[2])},2.2,'#777');ink(x,v=>{v.moveTo(g.h[0]+11,g.h[1]+20);v.lineTo(g.h[0]+10,g.h[1]+70)},2.2,'#777');
 ink(x,g.p,3.4);ink(x,g.e,3.4)}
function foam(s){const x=c,p=s.p.length<2?[s.p[0],[s.p[0][0]+.1,s.p[0][1]]]:s.p;x.lineCap=x.lineJoin='round';
 const P=()=>{x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]))};
 x.save();x.translate(1.4,-1);x.globalAlpha=.4;x.strokeStyle=INK;x.lineWidth=s.w+4;P();x.stroke();x.restore();
 x.strokeStyle=INK;x.lineWidth=s.w+4;P();x.stroke();x.strokeStyle='#fff';x.lineWidth=s.w;P();x.stroke();
 x.strokeStyle='rgba(0,0,0,.38)';x.lineWidth=1.4;
 for(const o of[-.3,0,.3]){x.beginPath();p.forEach((q,i)=>{const a=p[Math.max(0,i-2)],b=p[Math.min(p.length-1,i+2)],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,X=q[0]-dy/l*o*s.w,Y=q[1]+dx/l*o*s.w;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()}}
function stick(x,s,px,py,sc=1,r=0){const[a,b,f]=SK[s];x.save();x.translate(px,py);x.rotate(r);x.scale(sc,sc);x.translate(-24,-24);x.fillStyle='#fff';x.fill(a);ink(x,a,2.4);if(b)ink(x,b,2.2);if(f){x.fillStyle=INK;x.fill(f)}x.restore()}
function title(){let fs=60;c.font=fs+'px TS';const w=c.measureText(TT).width;if(w>620){fs*=620/w;c.font=fs+'px TS'}c.textAlign='center';c.fillStyle=INK;c.globalAlpha=.4;c.fillText(TT,362,806);c.globalAlpha=1;c.fillText(TT,360,804);ink(c,x=>{x.moveTo(190,828);x.bezierCurveTo(300,820,420,836,530,824)},2.6)}
function ground(g){ink(c,x=>{x.moveTo(150,g.gy+4);x.lineTo(570,g.gy+4)},2.4,'#666');ink(c,x=>{x.moveTo(210,g.gy+15);x.lineTo(510,g.gy+15)},1.8,'#999');ink(c,x=>{for(let i=0;i<7;i++){x.moveTo(235+i*42,g.gy+8);x.lineTo(226+i*42,g.gy+22)}},1.4,'#aaa')}
function tap(g){const lx=pour?402:360;
 c.fillStyle='#fff';c.fillRect(300,70,120,36);c.fillRect(345,106,30,58);
 ink(c,x=>{x.rect(300,70,120,36)},3.4);ink(c,x=>{x.moveTo(330,70);x.lineTo(330,-4);x.moveTo(390,70);x.lineTo(390,-4)},3.4);
 ink(c,x=>{x.moveTo(345,106);x.lineTo(345,164);x.lineTo(375,164);x.lineTo(375,106)},3.4);
 ink(c,x=>{x.moveTo(360,70);x.lineTo(lx,28);x.moveTo(lx+9,28);x.arc(lx,28,9,0,6.3)},3);
 if(pour){const sy=L>0?g.b-(g.b-g.t-34)*L:g.b-4,sx=360+Math.sin(T*18)*1.5;c.save();c.globalAlpha=.92;c.strokeStyle=COL[ci];c.lineWidth=12;c.lineCap='butt';c.beginPath();c.moveTo(sx,164);c.lineTo(sx,sy);c.stroke();c.restore();
  ink(c,x=>{x.moveTo(sx-6,164);x.lineTo(sx-6,sy);x.moveTo(sx+6,164);x.lineTo(sx+6,sy)},2)}}
function bag(p){c.save();c.translate(p[0],p[1]);const f=x=>{x.moveTo(0,0);x.lineTo(26,-64);x.quadraticCurveTo(46,-76,64,-42);x.closePath()};c.fillStyle='#fff';c.beginPath();f(c);c.fill();ink(c,f,2.6);ink(c,x=>{x.moveTo(30,-56);x.lineTo(50,-46);x.moveTo(24,-40);x.lineTo(42,-32)},1.6,'#777');c.restore()}
function draw(){const g=G[gi];c.setTransform(D,0,0,D,0,0);c.globalAlpha=1;c.fillStyle='#fff';c.fillRect(0,0,W,H);
 title();ground(g);glass(c,g,L,COL[ci]);if(st==1)tap(g);strokes.forEach(foam);stk.forEach(s=>stick(c,s.s,s.x,s.y,s.sc,s.r));
 if(st==2){const p=down?sp:mp;if(p)bag(p)}
 c.setTransform(1,0,0,1,0,0);c.fillStyle=GP;c.fillRect(0,0,cv.width,cv.height)}
// sound
let AC,NB,pn,gn,mg;
function au(){if(AC){if(AC.state=='suspended')AC.resume();return}AC=new(window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NB=b;
 mg=AC.createGain();mg.gain.value=mute?0:1;mg.connect(AC.destination);pn=nz('bandpass',900,.8);gn=nz('lowpass',500,.5)}
function nz(ty,f,q){const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const fl=AC.createBiquadFilter();fl.type=ty;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(mg);s.start();return{fl,g}}
function tone(f,d=.15,v=.12,ty='sine',f2){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.6);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}
const pop=()=>tone(600,.12,.15,'sine',950),ok=()=>{tone(520,.16,.14,'triangle');setTimeout(()=>tone(780,.22,.14,'triangle'),90)};
function shut(){if(!AC)return;const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();s.buffer=NB;f.type='highpass';f.frequency.value=2000;g.gain.setValueAtTime(.3,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.09);s.connect(f);f.connect(g);g.connect(mg);s.start(0,0,.1);tone(180,.08,.2,'square')}
const NT=[523,587,659,784,880,784,659,587];let ni=0;setInterval(()=>{if(AC&&!mute&&AC.state=='running'){tone(NT[ni%8]*(ni%16>7?.75:1),1.2,.03,'triangle');ni++}},520);
function startPour(){if(L>=1)return;au();pour=1;dirty=1;pn.g.gain.setTargetAtTime(.2,AC.currentTime,.04)}
function stopPour(){pour=0;if(AC)pn.g.gain.setTargetAtTime(0,AC.currentTime,.05);dirty=1;chk()}
function chk(){$('#nx').disabled=st==1&&L<.08}
// loop
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;spd=0;
 if(pour){L=Math.min(1,L+dt*.21);BT+=dt*45;pn.fl.frequency.value=800+L*1600;chk();if(L>=1){stopPour();tone(988,.3,.15,'triangle');setTimeout(()=>tone(1318,.4,.15,'triangle'),120)}}
 if(down&&st==2&&tgt){sp[0]+=(tgt[0]-sp[0])*.32;sp[1]+=(tgt[1]-sp[1])*.32;const s=strokes[strokes.length-1],q=s.p[s.p.length-1],d=Math.hypot(sp[0]-q[0],sp[1]-q[1]);if(d>2.2){s.p.push([sp[0],sp[1]]);spd=d/Math.max(dt,.008)}}
 if(AC)gn.g.gain.setTargetAtTime(Math.min(.08,spd/7000),AC.currentTime,.05);
 if(!(dirty||pour||down))return;dirty=0;draw()}
// ui
const GR=[...document.querySelectorAll('.g')],gb=[],sw=[],sz=[],sb=[];
G.forEach((g,i)=>{const b=mk('button','b th'),cn=mk('canvas');cn.width=144;cn.height=184;cn.style.cssText='width:72px;height:92px';b.appendChild(cn);const x=cn.getContext('2d');x.scale(.4,.4);x.translate(-213,-283);K=3.2;glass(x,g,0,'#fff');K=1;
 b.setAttribute('aria-label','แก้ว '+(i+1));b.onclick=()=>{au();gi=i;pop();sync()};GR[0].appendChild(b);gb.push(b)});
COL.forEach((col,i)=>{const b=mk('button','b sw','<i></i>');b.style.setProperty('--c',col);b.setAttribute('aria-label','สีเบียร์ '+(i+1));b.onclick=()=>{au();ci=i;pop();sync()};GR[1].appendChild(b);sw.push(b)});
const pb=mk('button','b big','กดค้างเพื่อเติมเบียร์');pb.onpointerdown=e=>{pb.setPointerCapture(e.pointerId);startPour()};pb.onpointerup=pb.onpointercancel=stopPour;pb.oncontextmenu=e=>e.preventDefault();GR[1].appendChild(pb);
SZ.forEach(s=>{const b=mk('button','b sz',`<i style="width:${s*.55+4}px;height:${s*.55+4}px"></i>`);b.setAttribute('aria-label','ขนาดหัวบีบ');b.onclick=()=>{au();bs=s;pop();sync()};GR[2].appendChild(b);sz.push(b)});

[2,3].forEach(i=>{const b=mk('button','b','ลบล่าสุด');b.onclick=ud;GR[i].appendChild(b)});
SK.forEach((a,i)=>{const b=mk('button','b th'),cn=mk('canvas');cn.width=cn.height=88;cn.style.cssText='width:44px;height:44px';b.appendChild(cn);const x=cn.getContext('2d');x.scale(88/54,88/54);x.translate(3,3);stick(x,i,24,24);

function rz(){const s=$('#st'),k=Math.min(s.clientWidth/W,s.clientHeight/H);cv.style.width=W*k+'px';cv.style.height=H*k+'px'}
function sync(){GR.forEach((e,i)=>e.classList.toggle('on',i==st));$('#lb').textContent=LB[st];$('#bk').disabled=st==0;$('#nx').textContent=st==3?'บันทึกภาพ':'ต่อไป';chk();mp=null;
 gb.forEach((b,i)=>b.classList.toggle('on',i==gi));sw.forEach((b,i)=>b.classList.toggle('on',i==ci));sz.forEach((b,i)=>b.classList.toggle('on',SZ[i]==bs));sb.forEach((b,i)=>b.classList.toggle('on',i==sel));dirty=1;requestAnimationFrame(rz)}
$('#bk').onclick=()=>{au();st--;pop();sync()};
$('#nx').onclick=()=>{au();if(st<3){st++;ok();sync()}else save()};
$('#sn').onclick=e=>{au();mute=!mute;e.currentTarget.classList.toggle('m',mute);if(mg)mg.gain.value=mute?0:1};
$('#oc').onclick=()=>{$('#ov').style.display='none'};
// canvas input
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
const hit=p=>{for(let i=stk.length-1;i>=0;i--)if(Math.hypot(stk[i].x-p[0],stk[i].y-p[1])<30*stk[i].sc)return i;return-1};
cv.onpointerdown=e=>{au();cv.setPointerCapture(e.pointerId);const p=pt(e);down=1;dirty=1;
 if(st==1)startPour();
 else if(st==2){sp=p.slice();tgt=p;mp=p;strokes.push({p:[p.slice()],w:bs});tone(420,.12,.1,'sine',640)}
 else if(st==3){drag=hit(p);if(drag<0){stk.push({s:sel,x:p[0],y:p[1],sc:1.5,r:(Math.random()-.5)*.5});drag=stk.length-1;tone(900,.1,.14,'sine',1400)}}};
cv.onpointermove=e=>{const p=pt(e);mp=p;dirty=1;if(!down)return;if(st==2)tgt=p;else if(st==3&&drag>=0){stk[drag].x=p[0];stk[drag].y=p[1]}};
cv.onpointerup=cv.onpointercancel=()=>{down=0;drag=-1;if(st==1)stopPour();dirty=1};
cv.onpointerleave=()=>{mp=null;dirty=1};
// save
async function save(){shut();cv.classList.add('snap');setTimeout(()=>cv.classList.remove('snap'),320);draw();
 const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
 try{if(!DL)throw 0;await DL.save({filename:'butterbeer-siabrom.png',data:blob})}catch(e){if(e&&e.code==='declined')return;$('#oi').src=URL.createObjectURL(blob);$('#ov').style.display='flex'}}
try{window.claude&&claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
addEventListener('resize',rz);sync();rz();
if(document.fonts)document.fonts.load('60px TS').then(()=>{dirty=1});
requestAnimationFrame(loop);
